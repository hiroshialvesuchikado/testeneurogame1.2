<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NeuroGame — Prova</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<main class="game">

    <h1>
        NeuroGame
    </h1>


    <h2 id="pergunta">
        Preparando prova...
    </h2>


    <div class="painel">

        <span>
            Pontos:
            <strong id="pontos">
                0
            </strong>
        </span>


        <span>
            Questão:
            <strong id="numeroQuestao">
                1
            </strong>

            /

            <strong id="totalQuestoes">
                0
            </strong>
        </span>


        <span>
            Erros:
            <strong id="erros">
                0
            </strong>
        </span>

    </div>


    <p id="feedback"></p>


    <div class="cerebro">

        <img
            id="imagemAnatomica"
            alt="Imagem anatômica"
        >


        <svg
            id="camadaHotspots"
            class="hotspots"
        ></svg>

    </div>


</main>


<script src="Mapas/mapaPalcoTelencefalo.js"></script>
<script src="Mapas/mapaPalcoTelencefaloMedial.js"></script>

<script src="Mapas/catalogoMapas.js"></script>

<script src="js/analytics.js"></script>
<script src="js/prova.js"></script>


</body>

</html>
