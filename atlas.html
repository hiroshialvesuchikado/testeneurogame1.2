<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Teste Atlas</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

<main class="game">

    <h1>Atlas Interativo</h1>

    <h2>
        Teste de carregamento
    </h2>

    <p>
        Se você está vendo esta página,
        o atlas.html está sendo carregado corretamente.
    </p>

    <img
        src="./imagens/PalcoTelencefalo.png"
        alt="Telencéfalo"
        style="max-width: 500px; width: 100%;"
    >

    <p>
        Mapa escolhido:
        <strong id="mapaEscolhido"></strong>
    </p>

</main>

<script>

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const mapa =
        parametros.get("mapa");

    document.getElementById(
        "mapaEscolhido"
    ).textContent =
        mapa || "nenhum";

</script>

</body>

</html>
