<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NeuroGame — Atlas Interativo</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<main class="game">


    <!-- ==================================================
         TÍTULO
         ================================================== -->

    <h1>
        Atlas Interativo
    </h1>



    <!-- ==================================================
         TELA DE SELEÇÃO DE MAPA
         ================================================== -->

    <section id="telaSelecaoAtlas">


        <h2>
            Escolha um mapa
        </h2>


        <div class="menu-mapas">


            <!-- ==============================
                 TELENCÉFALO LATERAL
                 ============================== -->

            <button
                class="card-atlas"
                data-mapa="telencefalo-lateral"
                type="button"
            >

                <img
                    src="imagens/PalcoTelencefalo.png"
                    alt="Telencéfalo em vista lateral"
                >

                <span>
                    Telencéfalo — Vista Lateral
                </span>

            </button>



            <!-- ==============================
                 TELENCÉFALO MEDIAL
                 ============================== -->

            <button
                class="card-atlas"
                data-mapa="telencefalo-medial"
                type="button"
            >

                <img
                    src="imagens/PalcoTelencefaloMedial.png"
                    alt="Telencéfalo em vista medial"
                >

                <span>
                    Telencéfalo — Vista Medial
                </span>

            </button>



            <!-- ==============================
                 CADÁVER — SULCOS LATERAIS
                 ============================== -->

            <button
                class="card-atlas"
                data-mapa="cadavertelencefalo-lateral"
                type="button"
            >

                <img
                    src="imagens/CadaverTelencefaloLateral.png"
                    alt="Sulcos do telencéfalo em cadáver"
                >

                <span>
                    Sulcos Telencéfalo — Vista Lateral
                </span>

            </button>


        </div>



        <!-- ==================================================
             VOLTAR AO MENU PRINCIPAL
             ================================================== -->

        <div class="acoes-atlas">

            <button
                id="voltarPrincipal"
                class="botao-acao"
                type="button"
            >
                ← Voltar ao menu principal
            </button>

        </div>


    </section>



    <!-- ==================================================
         TELA DO ATLAS INTERATIVO
         ================================================== -->

    <section
        id="telaMapaAtlas"
        style="display: none;"
    >


        <h2 id="tituloMapaAtlas">
            Carregando mapa...
        </h2>


        <p>
            Clique em uma estrutura para identificá-la.
        </p>



        <!-- ==================================================
             INFORMAÇÃO DA ESTRUTURA
             ================================================== -->

        <div
            id="infoAtlas"
            class="info-atlas"
        >

            <span>
                Estrutura selecionada:
            </span>

            <strong id="nomeEstruturaAtlas">
                Nenhuma
            </strong>

        </div>



        <!-- ==================================================
             IMAGEM + HOTSPOTS
             ================================================== -->

        <div class="cerebro">

            <img
                id="imagemAnatomica"
                alt="Imagem anatômica"
            >

            <svg
                id="camadaHotspots"
                class="hotspots"
                preserveAspectRatio="none"
            ></svg>

        </div>



        <!-- ==================================================
             BOTÕES
             ================================================== -->

        <div class="acoes-atlas">

            <button
                id="trocarMapaAtlas"
                class="botao-acao"
                type="button"
            >
                ← Escolher outro mapa
            </button>


            <button
                id="voltarPrincipalMapa"
                class="botao-acao"
                type="button"
            >
                🏠 Menu principal
            </button>

        </div>


    </section>


</main>



<!-- ==================================================
     ARQUIVOS DOS MAPAS

     IMPORTANTE:
     os arquivos dos mapas precisam ser carregados
     ANTES do catalogoMapas.js
     ================================================== -->

<script src="Mapas/mapaPalcoTelencefalo.js"></script>

<script src="Mapas/mapaPalcoTelencefaloMedial.js"></script>

<script src="Mapas/mapaCadaverSulcosTelencefaloLateral.js"></script>

<script src="Mapas/catalogoMapas.js"></script>



<script>

// ======================================================
// ATLAS INTERATIVO — NEUROGAME
// ======================================================



// ======================================================
// 1. ELEMENTOS HTML
// ======================================================

const telaSelecaoAtlas =
    document.getElementById(
        "telaSelecaoAtlas"
    );


const telaMapaAtlas =
    document.getElementById(
        "telaMapaAtlas"
    );


const tituloMapaAtlas =
    document.getElementById(
        "tituloMapaAtlas"
    );


const nomeEstruturaAtlas =
    document.getElementById(
        "nomeEstruturaAtlas"
    );


const imagemAtlas =
    document.getElementById(
        "imagemAnatomica"
    );


const svgAtlas =
    document.getElementById(
        "camadaHotspots"
    );


const botaoVoltarPrincipal =
    document.getElementById(
        "voltarPrincipal"
    );


const botaoTrocarMapa =
    document.getElementById(
        "trocarMapaAtlas"
    );


const botaoVoltarPrincipalMapa =
    document.getElementById(
        "voltarPrincipalMapa"
    );



// ======================================================
// 2. LER O MAPA DA URL
// ======================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );


const idMapaSelecionado =
    parametros.get(
        "mapa"
    );



// ======================================================
// 3. DECIDIR QUAL TELA MOSTRAR
// ======================================================

if (!idMapaSelecionado) {

    mostrarSelecaoAtlas();

}

else {

    abrirAtlas(
        idMapaSelecionado
    );

}



// ======================================================
// 4. MOSTRAR TELA DE SELEÇÃO
// ======================================================

function mostrarSelecaoAtlas() {

    telaSelecaoAtlas.style.display =
        "block";


    telaMapaAtlas.style.display =
        "none";

}



// ======================================================
// 5. ABRIR MAPA DO ATLAS
// ======================================================

function abrirAtlas(
    idMapa
) {

    const mapa =
        catalogoMapas.find(
            function(item) {

                return (
                    item.id ===
                    idMapa
                );

            }
        );


    // ==============================================
    // MAPA NÃO ENCONTRADO
    // ==============================================

    if (!mapa) {

        telaSelecaoAtlas.style.display =
            "none";


        telaMapaAtlas.style.display =
            "block";


        tituloMapaAtlas.textContent =
            "Mapa não encontrado";


        nomeEstruturaAtlas.textContent =
            "Verifique o catálogo de mapas.";


        console.error(
            "Mapa não encontrado:",
            idMapa
        );


        return;

    }


    // ==============================================
    // MOSTRAR ATLAS
    // ==============================================

    telaSelecaoAtlas.style.display =
        "none";


    telaMapaAtlas.style.display =
        "block";


    tituloMapaAtlas.textContent =
        mapa.titulo;


    nomeEstruturaAtlas.textContent =
        "Nenhuma";


    carregarImagemAtlas(
        mapa
    );

}



// ======================================================
// 6. CARREGAR IMAGEM
// ======================================================

function carregarImagemAtlas(
    mapa
) {

    console.log(
        "Carregando imagem:",
        mapa.imagem
    );


    imagemAtlas.onload =
        function() {

            console.log(
                "Imagem carregada com sucesso:",
                mapa.imagem
            );


            criarEstruturasAtlas(
                mapa
            );

        };


    imagemAtlas.onerror =
        function() {

            console.error(
                "Erro ao carregar imagem:",
                mapa.imagem
            );


            tituloMapaAtlas.textContent =
                mapa.titulo;


            nomeEstruturaAtlas.textContent =
                "Erro ao carregar a imagem.";

        };


    /*
        Como atlas.html está na RAIZ do projeto,
        usamos diretamente o caminho do catálogo.

        Exemplo:

        imagens/PalcoTelencefalo.png
    */

    imagemAtlas.src =
        mapa.imagem;

}



// ======================================================
// 7. CRIAR HOTSPOTS DO ATLAS
// ======================================================

function criarEstruturasAtlas(
    mapa
) {

    // Limpa estruturas antigas

    svgAtlas.innerHTML =
        "";


    // Usa as dimensões naturais da imagem

    svgAtlas.setAttribute(
        "viewBox",
        `0 0 ${imagemAtlas.naturalWidth} ${imagemAtlas.naturalHeight}`
    );


    // ==============================================
    // CRIAR TODAS AS ESTRUTURAS
    // ==============================================

    mapa.estruturas.forEach(
        function(estrutura) {

            let elemento;



            // ==========================================
            // ESTRUTURA TIPO LINHA
            // ==========================================

            if (
                estrutura.tipo ===
                "linha"
            ) {

                elemento =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "polyline"
                    );


                elemento.classList.add(
                    "estrutura",
                    "estrutura-linha",
                    "estrutura-atlas"
                );


                elemento.setAttribute(
                    "fill",
                    "none"
                );

            }



            // ==========================================
            // ESTRUTURA TIPO ÁREA
            // ==========================================

            else {

                elemento =
                    document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "polygon"
                    );


                elemento.classList.add(
                    "estrutura",
                    "estrutura-area",
                    "estrutura-atlas"
                );

            }



            // ==========================================
            // COORDENADAS
            // ==========================================

            elemento.setAttribute(
                "points",
                estrutura.pontos
            );



            // ==========================================
            // DADOS DA ESTRUTURA
            // ==========================================

            elemento.dataset.id =
                estrutura.id;


            elemento.dataset.nome =
                estrutura.nome;


            elemento.dataset.tipo =
                estrutura.tipo ||
                "area";


            elemento.dataset.info =
                estrutura.info ||
                "";



            // ==========================================
            // CLIQUE
            // ==========================================

            elemento.addEventListener(
                "click",

                function(event) {

                    event.stopPropagation();


                    selecionarEstruturaAtlas(
                        elemento
                    );

                }
            );



            // ==========================================
            // ADICIONAR AO SVG
            // ==========================================

            svgAtlas.appendChild(
                elemento
            );

        }
    );


    console.log(
        "Estruturas do atlas criadas:",
        document.querySelectorAll(
            ".estrutura-atlas"
        ).length
    );

}



// ======================================================
// 8. SELECIONAR ESTRUTURA
// ======================================================

function selecionarEstruturaAtlas(
    elemento
) {

    // ==============================================
    // REMOVER DESTAQUE ANTERIOR
    // ==============================================

    const estruturas =
        document.querySelectorAll(
            ".estrutura-atlas"
        );


    estruturas.forEach(
        function(estrutura) {

            estrutura.classList.remove(
                "selecionada-atlas"
            );

        }
    );



    // ==============================================
    // DESTACAR A ESTRUTURA CLICADA
    // ==============================================

    elemento.classList.add(
        "selecionada-atlas"
    );



    // ==============================================
    // MOSTRAR NOME
    // ==============================================

    nomeEstruturaAtlas.textContent =
        elemento.dataset.nome;


    console.log(
        "Estrutura selecionada:",
        elemento.dataset.nome
    );

}



// ======================================================
// 9. CARDS DA TELA DE SELEÇÃO
// ======================================================

const cardsAtlas =
    document.querySelectorAll(
        ".card-atlas"
    );


cardsAtlas.forEach(
    function(card) {

        card.addEventListener(
            "click",

            function() {

                const mapa =
                    card.dataset.mapa;


                console.log(
                    "Abrindo atlas:",
                    mapa
                );


                window.location.href =
                    `atlas.html?mapa=${mapa}`;

            }
        );

    }
);



// ======================================================
// 10. ESCOLHER OUTRO MAPA
// ======================================================

botaoTrocarMapa.addEventListener(
    "click",

    function() {

        window.location.href =
            "atlas.html";

    }
);



// ======================================================
// 11. VOLTAR AO MENU PRINCIPAL
// ======================================================

botaoVoltarPrincipal.addEventListener(
    "click",

    function() {

        window.location.href =
            "index.html";

    }
);



botaoVoltarPrincipalMapa.addEventListener(
    "click",

    function() {

        window.location.href =
            "index.html";

    }
);


</script>


</body>

</html>
